# Configuración base. Todas las ejecuciones parten de aquí: los ficheros de
# configs/examples/ y los --set de la línea de comandos solo indican lo que cambia.
seed: 42
device: auto              # auto | cpu | cuda
mode: federated           # federated | local_only (referencia «suelo»: sin comunicación)

data:
  dataset: fmnist
  root: ./data

partition:
  type: dirichlet         # iid | dirichlet | shards
  n_clients: 10
  alpha: 0.1              # concentración de Dirichlet (dirichlet y shards)
  classes_per_client: 2   # solo shards

model:
  name: mlp               # mlp | cnn (cnn3x3 y cnn_gn: solo para comparar variantes de la CNN)
  hidden: 200             # solo mlp
  direcciones: 160        # reto, solo rda: nº de direcciones para la forma de cada clase
  rango: 128              # reto, solo rda2: direcciones propias de cada clase en el modelo final

client:                   # lo que hace cada cliente en su entrenamiento local
  local_epochs: 1
  batch_size: 32
  lr: 0.01
  fedprox_mu: 0.0         # > 0 activa FedProx
  estadisticos: false     # reto: el cliente sube estadísticos en vez de pesos (ClienteEstadisticos)
  rango: 16               # reto, solo rda2: direcciones propias que manda el cliente de cada clase

server:                   # lo que decide el servidor en cada ronda
  rounds: 30
  fraction: 0.5           # fracción de clientes que participa en cada ronda (C)
  aggregator: fedavg      # nombre registrado en build_aggregator
  codec: none             # nombre registrado en build_codec: none (sin compresión) | int8 | topk
  topk_fraction: 0.1      # solo topk: fracción de componentes que sube cada cliente
  contraccion: 0.01       # solo lda_robusto: regularización de la covarianza
  umbral_coherencia: 0.5  # solo lda_robusto: fracción de clases coherentes para fiarse de un cliente
  minimo_clase: 5         # reto: nº mínimo de ejemplos de una clase para subir su suma
  mezcla: 0.25            # solo rda_robusto: cuánto de la forma propia de cada clase (0 = LDA)
  fijar_con: 30           # solo rda_robusto: con cuántos clientes fiables se fijan las direcciones

output:
  dir: runs
  name: null              # null: nombre automático a partir de la configuración
